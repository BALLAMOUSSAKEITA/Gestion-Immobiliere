services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gestion_immo
      POSTGRES_PASSWORD: gestion_immo
      POSTGRES_DB: gestion_immo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_immo -d gestion_immo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
